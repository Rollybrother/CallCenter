plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.daelim'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Keep the existing BCrypt/session login without enabling a second login filter.
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    runtimeOnly 'net.sf.jt400:jt400:11.1'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
}

springBoot {
    mainClass = 'com.daelim.Callcenter.CallCenterApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'callcenter.jar'
}

// Distribute only the executable Spring Boot application.
tasks.named('jar') {
    enabled = false
}
