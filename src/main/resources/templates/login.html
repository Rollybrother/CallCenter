<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | 대림통상 콜센터</title>
    <link href="/login.css" rel="stylesheet">
</head>
<body>
    <main class="auth-layout">
        <section class="auth-intro" aria-label="콜센터 소개">
            <a class="auth-brand" href="/"><span class="brand-mark">D</span><span><strong>DAELIM</strong><small>CALL CENTER</small></span></a>
            <div class="intro-copy"><span class="eyebrow">OPERATIONS WORKSPACE</span><h1>더 명확하게 보는<br>콜센터 운영 현황</h1><p>상담원과 ALF 채널의 인입·응대·접수 현황을<br>한 곳에서 확인하세요.</p></div>
            <div class="intro-footer">DAELIM CALL CENTER · STATISTICS</div>
        </section>
        <section class="auth-content">
            <div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h2>로그인</h2><p class="subtitle">계정으로 로그인해 운영 현황을 확인하세요.</p>
                <form id="loginForm" action="/loginController/login" method="post">
                    <label for="id">아이디</label><input type="text" id="id" name="id" autocomplete="username" required placeholder="아이디를 입력하세요">
                    <label for="password">비밀번호</label><input type="password" id="password" name="password" autocomplete="current-password" required placeholder="비밀번호를 입력하세요">
                    <button type="submit" class="primary-button">로그인 <span aria-hidden="true">→</span></button>
                </form>
                <p class="error-message" th:if="${error}" th:text="${error}" role="alert"></p>
                <p class="auth-link">계정이 없으신가요? <a href="/loginController/signup">사용자 등록</a></p>
            </div>
        </section>
    </main>
</body>
</html>
