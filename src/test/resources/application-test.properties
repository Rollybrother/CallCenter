# Isolated databases; tests never read the developer's local database settings.
spring.config.import=
spring.datasource.url=jdbc:h2:mem:callcenter-test;MODE=MariaDB;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.second-datasource.url=jdbc:h2:mem:reception-test;MODE=DB2;DB_CLOSE_DELAY=-1
spring.second-datasource.username=sa
spring.second-datasource.password=
spring.second-datasource.driver-class-name=org.h2.Driver
app.jpa.maria.dialect=org.hibernate.dialect.H2Dialect
app.jpa.maria.ddl-auto=create-drop
app.jpa.db2.dialect=org.hibernate.dialect.H2Dialect
app.jpa.db2.ddl-auto=create-drop
