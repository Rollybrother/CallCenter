spring.application.name=CallCenter
# Optional machine-specific settings; this file is excluded from Git.
spring.config.import=optional:file:./config/application-local.properties

server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Login and statistics share one MariaDB pool and persistence unit.
spring.datasource.url=${CALLCENTER_DB_URL:jdbc:mariadb://localhost:3306/callcenter}
spring.datasource.username=${CALLCENTER_DB_USERNAME:}
spring.datasource.password=${CALLCENTER_DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.pool-name=callcenter-maria
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
app.jpa.maria.dialect=org.hibernate.dialect.MariaDBDialect
app.jpa.maria.ddl-auto=none

# IBM i / DB2 reception data; never create or change production tables.
spring.second-datasource.url=${CALLCENTER_DB2_URL:jdbc:as400://localhost/DAELIMDB}
spring.second-datasource.username=${CALLCENTER_DB2_USERNAME:}
spring.second-datasource.password=${CALLCENTER_DB2_PASSWORD:}
spring.second-datasource.driver-class-name=com.ibm.as400.access.AS400JDBCDriver
spring.second-datasource.hikari.pool-name=callcenter-db2
spring.second-datasource.hikari.maximum-pool-size=5
spring.second-datasource.hikari.connection-timeout=10000
spring.second-datasource.hikari.connection-test-query=VALUES 1
app.jpa.db2.dialect=org.hibernate.dialect.DB2iDialect
app.jpa.db2.ddl-auto=none
