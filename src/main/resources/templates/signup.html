<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 등록 | 대림통상 콜센터</title>
    <link href="/signup.css" rel="stylesheet">
    <script src="/signupScript.js" defer></script>
</head>
<body>
    <main class="auth-layout">
        <section class="auth-intro" aria-label="콜센터 소개">
            <a class="auth-brand" href="/"><span class="brand-mark">D</span><span><strong>DAELIM</strong><small>CALL CENTER</small></span></a>
            <div class="intro-copy"><span class="eyebrow">OPERATIONS WORKSPACE</span><h1>하나의 화면에서<br>모든 채널을.</h1><p>상담원과 ALF 운영 데이터를<br>쉽게 입력하고 확인하세요.</p></div>
            <div class="intro-footer">DAELIM CALL CENTER · STATISTICS</div>
        </section>
        <section class="auth-content"><div class="auth-card"><span class="eyebrow">CREATE ACCOUNT</span><h2>사용자 등록</h2><p class="subtitle">새 계정을 만들어 시작하세요.</p>
            <form id="signupForm" action="/loginController/signup" method="post">
                <label for="id">아이디</label><div class="input-with-button"><input type="text" id="id" name="id" autocomplete="username" required placeholder="아이디를 입력하세요"><button type="button" onclick="checkId()">중복확인</button></div>
                <span id="checkIdResult" class="check-result" role="status"></span>
                <label for="password">비밀번호</label><input type="password" id="password" name="password" autocomplete="new-password" required placeholder="비밀번호를 입력하세요">
                <button type="submit" class="primary-button" disabled id="signupButton">사용자 등록 <span aria-hidden="true">→</span></button>
            </form>
            <p class="error-message" th:if="${error}" th:text="${error}" role="alert"></p>
            <p class="auth-link">이미 계정이 있으신가요? <a href="/loginController/login">로그인</a></p>
        </div></section>
    </main>
</body>
</html>
